name: Private release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.2.0)"
        required: true
        default: v0.2.6

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: macos
            runs-on: macos-latest
          - platform: linux
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-cargo-

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run release quality gates
        run: |
          bun run lint:all
          bun run test
          bun run build

      - name: Validate Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      - name: Build installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (0.3): create these repo secrets BEFORE tagging —
          # TAURI_SIGNING_PRIVATE_KEY (content of lumina-updater.key, keep secret!)
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for the 0.3 internal key).
          # Without them this step fails at signing with a clear error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          # createUpdaterArtifacts only here (never in CI debug builds):
          # emits .sig + latest.json next to the installers for the updater endpoints.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Lumina ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: "internal"
          releaseDraft: true
          prerelease: false

      - name: Upload assets to public release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          REPO="yitom486/lumina-app"
          BODY="Lumina ${TAG} 发布。

          **安装包**
          - Windows x64：MSI / NSIS
          - macOS aarch64：DMG
          - Linux x64：AppImage / deb

          **冒烟**：安装后打开本地视频；Linux 需 X11 会话（Wayland 暂不支持原生视频面）。"

          # 从 CHANGELOG.md 提取当前版本的变更说明
          VERSION="${TAG#v}"
          CHANGELOG_BODY=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="${CHANGELOG_BODY}"
          fi

          # 确保 release 存在（首个平台创建，后续平台跳过）
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" \
              --title "Lumina ${TAG}" \
              --notes "$BODY"

          # 收集 tauri-action 构建的安装包（含 updater 签名；latest.json 由
          # merge-updater job 合成后上传，避免三平台互相覆盖）
          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/appimage/*.sig
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No installer artifacts found for this platform"
            exit 0
          fi

          for f in "${FILES[@]}"; do
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done

  updater:
    name: Merge updater metadata
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          SRC_REPO="yitom486/lumina"
          REPO="yitom486/lumina-app"
          VERSION="${TAG#v}"
          WORK="$(mktemp -d)"
          cd "$WORK"

          gh release download "$TAG" --repo "$REPO" --pattern "*.sig"

          BODY="Lumina ${TAG} 发布。

          **安装包**
          - Windows x64：MSI / NSIS
          - macOS aarch64：DMG
          - Linux x64：AppImage / deb

          **冒烟**：安装后打开本地视频；Linux 需 X11 会话（Wayland 暂不支持原生视频面）。"
          CHANGELOG_BODY=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found && /^## /{exit} found{print}" "$GITHUB_WORKSPACE/CHANGELOG.md")
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="${CHANGELOG_BODY}"
          fi

          PLATFORMS="$(mktemp)"
          echo '{}' > "$PLATFORMS"
          for sig in *.sig; do
            case "$sig" in
              *-setup.exe.sig) platform="windows-x86_64" ;;
              *.app.tar.gz.sig) platform="darwin-aarch64" ;;
              *.AppImage.sig) platform="linux-x86_64" ;;
              *) echo "skip unexpected signature file: $sig"; continue ;;
            esac
            bundle="${sig%.sig}"
            staged="$(mktemp)"
            jq --arg p "$platform" \
               --arg signature "$(base64 -w0 "$sig")" \
               --arg url "https://github.com/${REPO}/releases/download/${TAG}/${bundle}" \
               '.[$p] = {signature: $signature, url: $url}' "$PLATFORMS" > "$staged"
            mv "$staged" "$PLATFORMS"
            echo "mapped $platform -> $bundle"
          done

          if [ "$(jq 'keys | length' "$PLATFORMS")" -eq 0 ]; then
            echo "::error::no updater signatures found for ${TAG}"
            exit 1
          fi

          # 自检：源码仓草稿里的 latest.json 由 tauri-action 生成（单平台），
          # 我们的 signature 编码必须与它一致，否则宁可失败也不发布坏 JSON。
          if gh release download "$TAG" --repo "$SRC_REPO" --pattern "latest.json" --clobber; then
            for key in $(jq -r 'keys[]' "$PLATFORMS"); do
              if jq -e --arg k "$key" '.platforms | has($k)' latest.json >/dev/null; then
                expected="$(jq -r --arg k "$key" '.platforms[$k].signature' latest.json)"
                actual="$(jq -r --arg k "$key" '.[$k].signature' "$PLATFORMS")"
                if [ "$expected" != "$actual" ]; then
                  echo "::error::signature encoding mismatch for $key"
                  exit 1
                fi
                echo "signature encoding verified for $key"
              fi
            done
          else
            echo "::warning::source latest.json unavailable, skipping encoding self-check"
          fi

          jq -n --arg version "$VERSION" --arg notes "$BODY" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile wrapped "$PLATFORMS" \
            '$wrapped[0] as $platforms | {version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
