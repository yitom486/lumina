name: Private release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.2.0)"
        required: true
        default: v0.2.2

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: macos
            runs-on: macos-latest
          - platform: linux
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-cargo-

      - name: Install libmpv (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $mpvDir = 'src-tauri/native/mpv'
          $metadata = @{}
          Get-Content "$mpvDir/VERSION" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $metadata[$matches[1]] = $matches[2] }
          }
          if (-not (Test-Path "$mpvDir/libmpv-2.dll") -or -not (Test-Path "$mpvDir/mpv.lib")) {
            $archive = Join-Path $env:RUNNER_TEMP $metadata['archive']
            $extractDir = Join-Path $env:RUNNER_TEMP 'lumina-mpv-dev'
            curl.exe -L --fail --retry 3 -o $archive $metadata['url']
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            tar.exe -xf $archive -C $extractDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dll = Get-ChildItem -Path $extractDir -Recurse -Filter 'libmpv-2.dll' -File | Select-Object -First 1
            if ($null -eq $dll) {
              throw 'The libmpv archive did not contain libmpv-2.dll.'
            }
            Copy-Item $dll.FullName "$mpvDir/libmpv-2.dll" -Force
            $runtimeDir = "$mpvDir/runtime"
            New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
            Copy-Item $dll.FullName "$runtimeDir/libmpv-2.dll" -Force
            $exportNames = & dumpbin.exe /exports "$mpvDir/libmpv-2.dll" |
              ForEach-Object {
                if ($_ -match '^\s*\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)$') { $matches[1] }
              }
            if ($LASTEXITCODE -ne 0 -or $exportNames.Count -eq 0) {
              throw 'Could not read libmpv exports to create an MSVC import library.'
            }
            @('LIBRARY libmpv-2.dll', 'EXPORTS') + ($exportNames | ForEach-Object { "  $_" }) |
              Set-Content "$mpvDir/mpv.def" -Encoding ascii
            & lib.exe "/def:$mpvDir/mpv.def" /machine:x64 "/out:$mpvDir/mpv.lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $runtimeDir = "$mpvDir/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Copy-Item "$mpvDir/libmpv-2.dll" "$runtimeDir/libmpv-2.dll" -Force

      - name: Install libmpv (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install mpv pkg-config
          mkdir -p src-tauri/native/mpv/runtime
          # brew 的 libmpv*.dylib 多为指向 Cellar 的 symlink；tauri_build 打包资源时
          # 跟随 symlink 可能 Permission denied。解引用成可读写实体文件。
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          prefix = subprocess.check_output(["brew", "--prefix", "mpv"], text=True).strip()
          src = Path(prefix) / "lib"
          dst = Path("src-tauri/native/mpv/runtime")
          dst.mkdir(parents=True, exist_ok=True)
          staged = False
          for path in sorted(src.glob("libmpv*.dylib")):
              target = path.resolve()
              out = dst / path.name
              if out.exists() or out.is_symlink():
                  out.unlink()
              shutil.copy2(target, out)
              os.chmod(out, 0o755)
              print(f"staged {out} <- {target} ({out.stat().st_size} bytes)")
              staged = True
          if not staged:
              raise SystemExit(f"no libmpv*.dylib under {src}")
          PY
          ls -la src-tauri/native/mpv/runtime/

      - name: Install build deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libmpv-dev \
            libx11-dev \
            patchelf
          mkdir -p src-tauri/native/mpv/runtime
          shopt -s nullglob
          staged=0
          for lib in /usr/lib/x86_64-linux-gnu/libmpv.so*; do
            # -L 解引用，避免把指向系统路径的 symlink 交给 tauri resources
            cp -L "$lib" src-tauri/native/mpv/runtime/
            chmod a+rX "src-tauri/native/mpv/runtime/$(basename "$lib")"
            staged=1
          done
          if [ "$staged" -ne 1 ]; then
            echo "no libmpv.so* found under /usr/lib/x86_64-linux-gnu" >&2
            exit 1
          fi
          ls -la src-tauri/native/mpv/runtime/

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run release quality gates
        run: |
          bun run lint
          bun run test
          bun run build

      - name: Validate Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      - name: Build installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Lumina ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: "internal"
          releaseDraft: true
          prerelease: false

      - name: Upload assets to public release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          REPO="yitom486/lumina-app"
          BODY="Lumina ${TAG} 发布。

          **安装包**
          - Windows x64：MSI / NSIS
          - macOS aarch64：DMG
          - Linux x64：AppImage / deb

          **冒烟**：安装后打开本地视频；Linux 需 X11 会话（Wayland 暂不支持原生视频面）。"

          # 从 CHANGELOG.md 提取当前版本的变更说明
          VERSION="${TAG#v}"
          CHANGELOG_BODY=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="${CHANGELOG_BODY}"
          fi

          # 确保 release 存在（首个平台创建，后续平台跳过）
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" \
              --title "Lumina ${TAG}" \
              --notes "$BODY"

          # 收集 tauri-action 构建的安装包
          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No installer artifacts found for this platform"
            exit 0
          fi

          for f in "${FILES[@]}"; do
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done
