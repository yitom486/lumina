name: Private release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.2.0)"
        required: true
        default: v0.2.2

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: macos
            runs-on: macos-latest
          - platform: linux
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-cargo-

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run release quality gates
        run: |
          bun run lint:all
          bun run test
          bun run build

      - name: Validate Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      - name: Build installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (0.3): create these repo secrets BEFORE tagging —
          # TAURI_SIGNING_PRIVATE_KEY (content of lumina-updater.key, keep secret!)
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for the 0.3 internal key).
          # Without them this step fails at signing with a clear error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          # createUpdaterArtifacts only here (never in CI debug builds):
          # emits .sig + latest.json next to the installers for the updater endpoints.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Lumina ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: "internal"
          releaseDraft: true
          prerelease: false

      - name: Upload assets to public release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          REPO="yitom486/lumina-app"
          BODY="Lumina ${TAG} 发布。

          **安装包**
          - Windows x64：MSI / NSIS
          - macOS aarch64：DMG
          - Linux x64：AppImage / deb

          **冒烟**：安装后打开本地视频；Linux 需 X11 会话（Wayland 暂不支持原生视频面）。"

          # 从 CHANGELOG.md 提取当前版本的变更说明
          VERSION="${TAG#v}"
          CHANGELOG_BODY=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="${CHANGELOG_BODY}"
          fi

          # 确保 release 存在（首个平台创建，后续平台跳过）
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" \
              --title "Lumina ${TAG}" \
              --notes "$BODY"

          # 收集 tauri-action 构建的安装包
          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No installer artifacts found for this platform"
            exit 0
          fi

          for f in "${FILES[@]}"; do
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done
