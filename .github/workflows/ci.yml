name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_online_e2e:
        description: "Run network online-source E2E (needs YouTube access + yt-dlp download)"
        required: false
        default: "false"
      e2e_url:
        description: "Optional public video URL for online E2E (defaults to fixture video)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: macos
            runs-on: macos-latest
          - platform: linux
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-${{ matrix.platform }}-cargo-

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate frontend
        run: |
          bun run lint:all
          bun run test
          bun run build

      - name: Validate Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

  bundle-windows:
    name: Windows x64 debug bundle
    needs: validate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-windows-cargo-

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: windows

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows debug installers
        run: bun run build && bun run tauri build --debug

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-windows-x64-debug
          path: |
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  online-e2e:
    name: Online E2E (manual, network)
    if: github.event_name == 'workflow_dispatch' && inputs.run_online_e2e == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: windows

      - name: Install yt-dlp (latest stable)
        shell: pwsh
        run: |
          $dir = 'src-tauri/native/ytdl'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path "$dir/yt-dlp.exe")) {
            curl.exe -L --fail --retry 3 -o "$dir/yt-dlp.exe" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          }
          & "$dir/yt-dlp.exe" --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run online E2E (no cookies)
        working-directory: src-tauri
        run: cargo test --lib public_youtube_resolves_and_reaches_mpv_demux_without_cookies -- --ignored --nocapture
        env:
          LUMINA_ONLINE_E2E_URL: ${{ inputs.e2e_url }}
