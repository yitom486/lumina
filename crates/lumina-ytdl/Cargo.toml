[package]
name = "lumina-ytdl"
version = "0.4.0"
description = "Optional on-demand yt-dlp integration for Lumina"
edition = "2021"

[dependencies]
lumina-core.workspace = true
lumina-media.workspace = true
lumina-subtitle.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = { version = "3.1", features = ["json"] }
which = "7"
