[package]
name = "lumina-ytdl"
version = "0.3.0"
description = "Optional on-demand yt-dlp integration for Lumina"
edition = "2021"

[dependencies]
lumina-core = { path = "../lumina-core" }
lumina-media = { path = "../lumina-media" }
lumina-subtitle = { path = "../lumina-subtitle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = { version = "3.1", features = ["json"] }
which = "7"
