[package]
name = "lumina-mcp"
version = "0.4.0"
description = "Lumina MCP server, snapshots, tools, and policies"
edition = "2021"

[features]
test-support = []

[[bin]]
name = "lumina-mcp-stdio-test-server"
path = "tests/bin/lumina_mcp_stdio_test_server.rs"
required-features = ["test-support"]

[dependencies]
lumina-core.workspace = true
lumina-library.workspace = true
lumina-media.workspace = true
lumina-notes.workspace = true
lumina-subtitle.workspace = true
lumina-ytdl.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
