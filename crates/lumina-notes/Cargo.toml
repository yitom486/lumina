[package]
name = "lumina-notes"
version = "0.4.0"
description = "Timestamped notes, subtitle quotes, and Markdown export for Lumina"
edition = "2021"

[dependencies]
lumina-media.workspace = true
lumina-subtitle.workspace = true
lumina-ytdl.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
